# Checks for the server and the web app: typecheck, lint, formatting, tests (the server's against a
# real Postgres + pgvector) and the web build. Runs on pushes to main and pull requests, and before
# every deploy (cd.yml calls it).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ai_email
          POSTGRES_PASSWORD: ai_email
          POSTGRES_DB: ai_email
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_email -d ai_email"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/server/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://ai_email:ai_email@localhost:5432/ai_email

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

packages:
  - packages/*
  - apps/*

# Install scripts are off by default (pnpm 10+). esbuild (via tsx) ships its binary as an
# optional platform package, so its postinstall check isn't needed.
allowBuilds:
  esbuild: false
  # Downloads the Electron binary for this platform (official GitHub release).
  electron: true
  # Windows installer tooling from electron-builder; we only build for macOS.
  electron-winstaller: false

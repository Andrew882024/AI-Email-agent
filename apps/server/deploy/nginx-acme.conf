# ai-email-agent, first deploy only: answers Let's Encrypt's challenge for __DOMAIN__ until
# the certificate exists and deploy.sh switches to nginx.conf.
server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}

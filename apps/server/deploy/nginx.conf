# ai-email-agent: HTTPS for __DOMAIN__, all of it proxied to the app on 127.0.0.1:4317.
# Rendered by deploy.sh into /etc/nginx/sites-available/ai-email-agent.conf.
server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # Mail attachments and chat uploads (the API accepts up to 32 MB).
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Live updates and assistant replies are server-sent events: pass them on as they come.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
